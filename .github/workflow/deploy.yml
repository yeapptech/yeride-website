name: Deploy Firebase Functions

on:
  push:
    branches: [ functions-stage ]
    paths:
      - 'functions/**'
  pull_request:
    branches: [ functions-stage ]
    types: [closed]

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_STAGE }} --token ${{ secrets.FIREBASE_TOKEN_STAGE }}