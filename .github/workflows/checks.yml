# The two build gates, run on every pull request.
#
# deploy-all.yml only triggers on push to main, so without this the gates fire
# after a merge — main goes red and undeployable, which is the wrong end of the
# process to find out. Both scripts are dependency-free plain Node, so this needs
# no npm ci, no private registry and no NPM_TOKEN; it finishes in seconds.
#
# It deliberately does NOT run astro check or astro build — those need the
# @yeapptech registry. deploy-all.yml still runs the full chain on main.
#
# WHETHER IT SHOULD BUILD was asked directly, as wayfinder #68, and answered no.
# The reason to build here would have been the dist copy gate, which needs one —
# but the gap that argued for it was three ordinary authoring accidents (a phrase
# split by a tag, by an entity, or across a newline) that the source gate could
# not see. #68 gave the source gate the dist gate's own normaliser instead, so all
# three now fail on this job, in seconds, without a registry. What is left for the
# post-merge gate is vendored code, text the build injects, and concatenation
# Rollup folds — none of them things a PR author writes by accident. Measured
# before deciding: this job runs in ~12s and the full build job in ~32s, so the
# cost was never the point; the point is that nothing here needs a build.

name: Build checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: EN/ES route parity + copy gate
        run: npm run checks
