# The four dependency-free build gates, run on every pull request.
#
# deploy-all.yml only triggers on push to main, so without this the gates fire
# after a merge — main goes red and undeployable, which is the wrong end of the
# process to find out. All four scripts are dependency-free plain Node, so this
# needs no npm ci, no private registry and no NPM_TOKEN; it finishes in seconds.
#
# The last two, check-env-example.mjs (#70) and check-deploy-env.mjs (#90), are
# here for the same reason as the other two and not by accident of being cheap:
# they are the ONLY env-aware gates that can run on a pull request at all.
# check-env.mjs imports Vite and needs the six secrets, so drift between the
# three places a required variable name must appear — scripts/env-required.mjs,
# .env.example, and this workflow's sibling deploy-all.yml — would otherwise be
# caught on main, after the merge. Both read names only, never a value, which is
# what lets them live here.
#
# The deploy-env one matters most in the case it was filed over: miss the
# "Create env file" line and everything else agrees, so the deploy fails on main
# reporting a missing SECRET when the secret exists and the line does not. The
# cause named is not the cause. Catching it here names the actual missing line.
#
# It deliberately does NOT run astro check or astro build — those need the
# @yeapptech registry. deploy-all.yml still runs the full chain on main.
#
# WHETHER IT SHOULD BUILD was asked directly, as wayfinder #68, and answered no.
# The reason to build here would have been the dist copy gate, which needs one —
# but the gap that argued for it was three ordinary authoring accidents (a phrase
# split by a tag, by an entity, or across a newline) that the source gate could
# not see. #68 gave the source gate the dist gate's own normaliser instead, so all
# three now fail on this job, in seconds, without a registry. Measured before
# deciding (2026-08-03, last five deploys): this job runs in ~12s and the full
# build job in ~32s, so cost was never the point; the point is that nothing here
# needs a build.
#
# The post-merge gate is NOT thereby redundant, and #68's first pass understated
# what is left to it. Beyond vendored code and concatenation Rollup folds, it is
# the only layer that sees copy COMPOSED BY THE BUILD — "{copy.lead} {copy.tail}"
# is two innocent strings in the source and one phrase in the built HTML — and
# that one a PR author does hit by accident. It also takes the two normalisation
# views that can invent a phrase, which the source gate declines. So this job
# catches the accidents at authorship time; it does not replace the deploy gate.

name: Build checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: EN/ES route parity + copy gate + env name parity
        run: npm run checks
