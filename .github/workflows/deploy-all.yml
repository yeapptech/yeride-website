name: Deploy All

on:
  push:
    branches: [main, functions-stage, functions]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create env file
        run: |
          echo "PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions-stage:
    if: github.ref == 'refs/heads/functions-stage'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Functions-Stage code (functions-stage branch)
        uses: actions/checkout@v4
        with:
          ref: functions-stage
          path: firebase-functions-stage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase-functions-stage/functions/package-lock.json

      - name: Install functions-stage dependencies
        run: npm ci
        working-directory: firebase-functions-stage/functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}

      - name: Deploy Firebase Functions-Stage
        run: firebase deploy --only functions:api --project ${{ secrets.FIREBASE_PROJECT_STAGE }}
        working-directory: firebase-functions-stage

  deploy-functions:
    if: github.ref == 'refs/heads/functions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Functions code (functions branch)
        uses: actions/checkout@v4
        with:
          ref: functions
          path: firebase-functions

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase-functions/functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: firebase-functions/functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions:api --project ${{ secrets.FIREBASE_PROJECT }}
        working-directory: firebase-functions