name: Deploy All

on:
  push:
    branches: [main, functions-stage]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}" > .env
        
      - name: Setup Node
        uses: withastro/action@v3
        
      - name: Build Astro site
        run: npm run build
        
      - name: Clean previous artifacts
        run: |
          # Limpiar artifacts anteriores si existen
          if [ -d "./dist" ]; then
            rm -rf ./dist/.git
          fi
        
      - name: Upload to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 1
          name: pages-${{ github.run_id }}-${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions-stage:
    if: github.ref == 'refs/heads/functions-stage'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Functions-Stage code (functions-stage branch)
        uses: actions/checkout@v3
        with:
          ref: functions-stage
          path: firebase-functions-stage
          
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
          
      - name: Install functions-stage dependencies
        run: npm ci
        working-directory: firebase-functions-stage/functions
          
      - name: Deploy Firebase Functions-Stage
        run: firebase deploy --only functions:api --project ${{ secrets.FIREBASE_PROJECT_STAGE }} --token ${{ secrets.FIREBASE_TOKEN_STAGE }}
        working-directory: firebase-functions-stage