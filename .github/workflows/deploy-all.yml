name: Deploy All

on:
  push:
    branches: [main, functions-stage, functions]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Create env file
        run: |
          echo "PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}" > .env
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: "20"
          package-manager: "npm"
          path: "./"


  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions-stage:
    if: github.ref == 'refs/heads/functions-stage'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Functions-Stage code (functions-stage branch)
        uses: actions/checkout@v3
        with:
          ref: functions-stage
          path: firebase-functions-stage
          
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
          
      - name: Install functions-stage dependencies
        run: npm ci
        working-directory: firebase-functions-stage/functions
      
      - name: Decode service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}' | base64 -d > service-account-stage.json
      
      - name: Setup Google Cloud credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.workspace }}/service-account-stage.json
      
      - name: Deploy Firebase Functions-Stage
        run: firebase deploy --only functions:api --project ${{ secrets.FIREBASE_PROJECT_STAGE }}
        working-directory: firebase-functions-stage

  deploy-functions:
    if: github.ref == 'refs/heads/functions'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Functions code (functions branch)
        uses: actions/checkout@v3
        with:
          ref: functions
          path: firebase-functions
          
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
          
      - name: Install functions dependencies
        run: npm ci
        working-directory: firebase-functions/functions
      
      - name: Decode service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' | base64 -d > service-account.json
      
      - name: Setup Google Cloud credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.workspace }}/service-account.json
      
      - name: Deploy Firebase Functions
        run: firebase deploy --only functions:api --project ${{ secrets.FIREBASE_PROJECT }}
        working-directory: firebase-functions