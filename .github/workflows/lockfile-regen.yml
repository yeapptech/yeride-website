# Temporary — regenerates package-lock.json with the @yeapptech/yeride-brand
# entry using the NPM_TOKEN secret, then verifies npm ci + build. Deleted from
# the branch once the lockfile commit lands (wayfinder #35).
name: Regenerate lockfile

on: workflow_dispatch

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm install --package-lock-only

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add @yeapptech/yeride-brand lockfile entry" || echo "lockfile unchanged"
          git push

      - name: Verify npm ci + build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
